name: Code Quality (Oxlint)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-oxlint:
    runs-on: ubuntu-latest
    
    permissions:
       contents: read
       pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect JS/TS changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lintable:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/.oxlintrc.json'

      - name: Run Oxlint Action
        if: steps.changes.outputs.lintable == 'true'
        uses: oxc-project/oxlint-action@v1
        with:
          params: --deny-warnings
